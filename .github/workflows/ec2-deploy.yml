name: Deploy to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: ec2-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/src/main.js
          node --check frontend/src/services/api.js
          node --check frontend/src/ui/renderConclusions.js
          node --check frontend/src/ui/renderMetrics.js
          node --check frontend/src/ui/renderTables.js

      - name: Validate Docker Compose config
        run: docker compose config
      
      - name: Build Docker images
        run: docker compose build
        
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/nba-ref-analytics
            git pull --ff-only origin main
            docker compose up --build -d
            docker ps
